name: Web CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/web/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'pnpm-lock.yaml'

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Unit · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @xstore/web lint
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Typecheck
        run: pnpm --filter @xstore/web typecheck

      - name: Unit tests (Vitest)
        run: pnpm --filter @xstore/web test:unit

      - name: Build Next.js
        run: pnpm --filter @xstore/web build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          # Secrets dummy para build sin BD en CI
          DATABASE_URL: postgresql://user:pass@localhost:5432/xstore_ci

      - name: Upload reporte Next
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-build-output
          path: apps/web/.next
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @xstore/web build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          DATABASE_URL: postgresql://user:pass@localhost:5432/xstore_ci

      - name: Instalar Playwright
        run: pnpm --filter @xstore/web exec playwright install --with-deps chromium

      - name: Correr E2E
        run: pnpm --filter @xstore/web test:e2e

      - name: Upload reporte Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
