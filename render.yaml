services:
  - type: web
    name: xshop-web
    runtime: node
    plan: free
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm exec prisma generate && pnpm --filter @xstore/web build
    startCommand: pnpm --filter @xstore/web exec next start -p $PORT
    healthCheckPath: /
    domains:
      - xshop-peru.duckdns.org
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_URL
        value: https://xshop-peru.duckdns.org
      - key: AUTH_API_URL
        value: http://xshop-api:10000
      - key: NEXT_PUBLIC_SOCKET_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: xshop-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: xshop-redis
          type: keyvalue
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://xshop-peru.duckdns.org/api/auth/google/callback
      - key: LIVEKIT_URL
        value: wss://xshop-0rgrgkgb.livekit.cloud
      - key: NEXT_PUBLIC_LIVEKIT_URL
        value: wss://xshop-0rgrgkgb.livekit.cloud
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: WHATSAPP_SUPPORT_PHONE
        sync: false
      - key: NEXT_PUBLIC_WHATSAPP_SUPPORT_PHONE
        sync: false
      - key: ALLOW_DEMO_CATALOG
        value: 'false'

  - type: web
    name: xshop-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGIN
        value: https://xshop-peru.duckdns.org
      - key: DATABASE_URL
        fromDatabase:
          name: xshop-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: xshop-redis
          type: keyvalue
          property: connectionString
      - key: REDIS_REQUIRED
        value: 'true'

  - type: keyvalue
    name: xshop-redis
    plan: free
    ipAllowList: []

databases:
  - name: xshop-postgres
    plan: 0.1c-256mb
    postgresMajorVersion: '16'
    databaseName: xstore
    user: xstore
    ipAllowList: []
