<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>X-STORE</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #05060a;
        background-image:
          radial-gradient(1000px 520px at 50% -10%, rgba(139, 92, 246, 0.28), transparent 70%),
          radial-gradient(760px 420px at 110% 110%, rgba(34, 211, 238, 0.16), transparent 70%);
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        padding: 24px;
      }
      .card { width: 100%; max-width: 340px; text-align: center; }
      .logo {
        width: 88px; height: 88px; margin: 0 auto 22px;
        display: grid; place-items: center;
        border-radius: 26px;
        font-size: 40px; font-weight: 900; letter-spacing: -1px;
        background: linear-gradient(135deg, #ff2d75, #7b5cff);
        box-shadow: 0 18px 46px rgba(123, 92, 255, 0.42);
      }
      h1 { margin: 0 0 6px; font-size: 26px; font-weight: 900; letter-spacing: -0.4px; }
      p { margin: 0; color: rgba(255, 255, 255, 0.5); font-size: 14px; line-height: 1.5; }
      .bar {
        height: 4px; margin: 26px 0 14px;
        border-radius: 999px; overflow: hidden;
        background: rgba(255, 255, 255, 0.09);
      }
      .bar span {
        display: block; height: 100%; width: 38%;
        border-radius: 999px;
        background: linear-gradient(90deg, #7b5cff, #ff2d75);
        animation: slide 1.15s ease-in-out infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(300%); }
      }
      button {
        margin-top: 6px; padding: 12px 22px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.06);
        color: #fff; font-size: 14px; font-weight: 700; cursor: pointer;
      }
      .hide { display: none; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">X</div>
      <h1>X-STORE</h1>
      <p id="msg">Conectando con la app…</p>
      <div class="bar" id="bar"><span></span></div>
      <button id="retry" class="hide" type="button">Reintentar</button>
    </div>
    <script>
      // Esta pantalla solo se ve si la app web no responde (sin señal o PC apagada).
      // Reintenta solo; nunca simula datos ni caché de la app.
      var attempts = 0;
      function retry() {
        attempts += 1;
        location.reload();
      }
      function offline() {
        document.getElementById('bar').classList.add('hide');
        document.getElementById('msg').textContent =
          'No pudimos conectar con X-STORE. Revisa tu internet e inténtalo de nuevo.';
        document.getElementById('retry').classList.remove('hide');
      }
      document.getElementById('retry').addEventListener('click', retry);

      // Si en 12 s seguimos aquí, es que la app web no cargó.
      setTimeout(function () {
        if (document.visibilityState === 'visible') offline();
      }, 12000);

      window.addEventListener('online', retry);
    </script>
  </body>
</html>
